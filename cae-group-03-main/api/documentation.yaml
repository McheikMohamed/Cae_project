  /reservations/createReservationLine:
    post:
      summary: Créer une ligne de réservation
      description: Permet de créer une ligne de réservation pour un batch spécifique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationLine'
      responses:
        '200':
          description: Ligne de réservation créée avec succès
        '400':
          description: Ligne de réservation invalide
  /reservations/createReservation:
    post:
      summary: Créer une réservation
      description: Permet de créer une réservation avec une liste de batches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NewBatch'
      responses:
        '200':
          description: Réservation créée avec succès
        '400':
          description: Réservation invalide
  /reservations/getReservationsLines:
    get:
      summary: Récupérer toutes les lignes de réservation
      description: Permet de récupérer toutes les lignes de réservation pour une réservation donnée.
      parameters:
        - name: reservationId
          in: query
          required: true
          description: ID de la réservation
          schema:
            type: integer
      responses:
        '200':
          description: Liste des lignes de réservation récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReservationLine'
        '400':
          description: Requête invalide
  /reservations/getReservations:
    get:
      summary: Récupérer toutes les réservations
      description: Permet de récupérer toutes les réservations.
      responses:
        '200':
          description: Liste des réservations récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
  /reservations/updateReservationStatus:
    patch:
      summary: Mettre à jour le statut d'une réservation
      description: Permet de mettre à jour le statut d'une réservation existante.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservation'
      responses:
        '200':
          description: Statut de la réservation mis à jour avec succès
        '400':
          description: Réservation invalide
  /reservations/userHistorics:
    get:
      summary: Récupérer l'historique des réservations fermées de l'utilisateur authentifié
      description: |
        Permet de récupérer toutes les réservations fermées liées à l'utilisateur authentifié. 
        Cette méthode utilise le token JWT présent dans l'en-tête Authorization pour identifier l'utilisateur.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des réservations fermées récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '401':
          description: Token JWT manquant ou invalide
        '404':
          description: Utilisateur non trouvé
  /reservations/delete:
    patch:
      summary: Supprimer une réservation
      description: |
        Permet de supprimer une réservation existante en fonction de son identifiant.
        L'identifiant de la réservation est fourni dans le corps de la requête.
      requestBody:
        required: true
        description: Identifiant de la réservation à supprimer
        content:
          application/json:
            schema:
              type: object
              properties:
                reservationId:
                  type: integer
                  example: 1
      responses:
        '200':
          description: Réservation supprimée avec succès
        '400':
          description: Requête invalide ou identifiant de réservation manquant
        '404':
          description: Réservation non trouvée
  /carts/add/{id}:
    post:
      summary: Ajouter un lot au panier
      description: |
        Ajoute un lot (batch) au panier de l'utilisateur identifié par son token JWT.
        L'utilisateur est identifié via le header Authorization contenant le token JWT.
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du batch à ajouter au panier
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lot ajouté au panier avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: Token JWT manquant ou invalide
        '404':
          description: Lot ou utilisateur non trouvé
  /carts/:
    get:
      summary: Récupérer tous les lots du panier
      description: |
        Récupère tous les lots (batches) présents dans le panier de l'utilisateur authentifié.
        L'utilisateur est identifié via le header Authorization contenant le token JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des lots présents dans le panier récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
        '401':
          description: Token JWT manquant ou invalide

  /carts/delete/{batchId}:
    delete:
      summary: Supprimer un lot du panier
      description: |
        Supprime un lot (batch) du panier de l'utilisateur authentifié en fonction de l'identifiant du batch.
        L'utilisateur est identifié via le header Authorization contenant le token JWT.
      parameters:
        - name: batchId
          in: path
          required: true
          description: Identifiant du batch à retirer du panier
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lot supprimé du panier avec succès
        '401':
          description: Token JWT manquant ou invalide
        '404':
          description: Lot ou utilisateur non trouvé
