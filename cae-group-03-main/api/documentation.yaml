openapi: 3.1.0
info:
  title: CAE exercices demo API
  description: API de démonstration pour le cours de CAE exercices
  version: 1.0.0
servers:
  - url: 'http://localhost:3000'
paths:

  /auths/login:
    post:
      summary: Connexion
      description: Connexion d'un utilisateur
      requestBody:
        required: true
        description: Identifiants de connexion
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              description: Token de connexion JWT
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Requête mal formée
        '401':
          description: Identifiants incorrects

  /auths/register:
    post:
      summary: Inscription
      description: Inscription d'un utilisateur
      requestBody:
        required: true
        description: Identifiants de l'utilisateur
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: Inscription réussie, renvoie un token JWT
          content:
            application/json:
              description: Token de connexion JWT
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '400':
          description: Requête mal formée
        '409':
          description: Utilisateur déjà existant

  /auths/account:
    get:
      summary: Récupérer les informations de l'utilisateur
      description: Récupère les informations de l'utilisateur connecté à partir du token JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Informations de l'utilisateur récupérées avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token manquant ou invalide
        '404':
          description: Utilisateur non trouvé

  /auths/me:
    post:
      summary: Mettre à jour le token JWT
      description: Génère un nouveau token JWT pour l'utilisateur connecté.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Nouveau token JWT généré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          description: Token manquant ou invalide
        '404':
          description: Utilisateur non trouvé

  /auths/updatePassword:
    patch:
      summary: Mettre à jour le mot de passe
      description: Permet à un utilisateur de mettre à jour son mot de passe.
      requestBody:
        required: true
        description: Informations nécessaires pour mettre à jour le mot de passe
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdate'
      responses:
        '200':
          description: Mot de passe mis à jour avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully
        '400':
          description: Requête mal formée ou mot de passe non valide
        '500':
          description: Erreur lors de la mise à jour du mot de passe
  /batches/create:
    post:
      summary: Créer un nouveau batch
      description: Permet de créer un nouveau batch avec une image associée.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                newBatch:
                  $ref: '#/components/schemas/NewBatch'
                picture:
                  type: string
                  format: binary
      responses:
        '200':
          description: Batch créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '400':
          description: Requête invalide
  /batches/all:
    get:
      summary: Récupérer tous les batches
      description: Permet de récupérer tous les batches disponibles.
      responses:
        '200':
          description: Liste des batches récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
  /batches/{id}:
    get:
      summary: Récupérer un batch par ID
      description: Permet de récupérer un batch spécifique en fonction de son ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID du batch
          schema:
            type: integer
      responses:
        '200':
          description: Batch récupéré avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
        '404':
          description: Batch non trouvé
  /batches/products:
    get:
      summary: Récupérer tous les produits
      description: Permet de récupérer tous les produits disponibles.
      responses:
        '200':
          description: Liste des produits récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /batches/productTypes:
    get:
      summary: Récupérer tous les types de produits
      description: Permet de récupérer tous les types de produits disponibles.
      responses:
        '200':
          description: Liste des types de produits récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductType'
